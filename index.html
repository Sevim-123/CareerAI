

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CareerAI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header>

    <h2>CareerAI.</h2>

    <nav>

      <a href="#">Home</a>

      <a href="#about">About</a>

      <a href="#features">Features</a>

    </nav>

  </header>

  <main>

    <section class="hero">

      <h1>Build Your Future With <span>AI</span></h1>

      <p>Your personal AI-powered career assistant.</p>

      <button onclick="showForm()">Get Started</button>

    </section>

    <section id="career-form" style="display:none;">

      <h2>Career Analysis</h2>

      <form onsubmit="analyzeCareer(event)">

        <label>Education</label>

        <input id="education" type="text" placeholder="Your education" required>

        <label>Skills</label>

        <input id="skills" type="text" placeholder="Your skills" required>

        <label>Career Goal</label>

        <input id="goal" type="text" placeholder="Your career goal" required>

        <label>Experience Level</label>

        <select id="experience">

          <option>Beginner</option>

          <option>Intermediate</option>

          <option>Advanced</option>

        </select>

        <button type="submit">Analyze My Career</button>

      </form>

      <div id="result"></div>

    </section>

  </main>

  <footer>

    <p>© 2026 CareerAI. All rights reserved.</p>

  </footer>

  <script>

    function showForm() {

      document.getElementById("career-form").style.display = "block";

      document.getElementById("career-form").scrollIntoView();

    }

    

function analyzeCareer(event) {

    event.preventDefault();

    const education = document.getElementById("education").value;

    const skills = document.getElementById("skills").value;

    const goal = document.getElementById("goal").value;

    const experience = document.getElementById("experience").value;

    document.getElementById("result").innerHTML =

        "<h3>Your Career Profile</h3>" +

        "<p><b>Education:</b> " + education + "</p>" +

        "<p><b>Skills:</b> " + skills + "</p>" +

        "<p><b>Career Goal:</b> " + goal + "</p>" +

        "<p><b>Experience:</b> " + experience + "</p>";

    document.getElementById("career-suggestion").textContent =

        "Your career goal is " + goal +

        ". Keep improving your technical skills and gain practical experience through projects.";

    
    document.getElementById("skill-suggestions").innerHTML =

        recommendations.map(skill => "<li>" + skill + "</li>").join("");

    document.getElementById("ai-result").style.display = "block";

    document.getElementById("ai-result").scrollIntoView({

        behavior: "smooth"

    });



const normalizedGoal = goal.toLowerCase();

let recommendations;

if (

    normalizedGoal.includes("artificial intelligence") ||

    normalizedGoal.includes("ai engineer")

) {

    recommendations = [

        "Python Programming",

        "Machine Learning",

        "Mathematics and Statistics",

        "Data Structures and Algorithms",

        "Deep Learning"

    ];

}

else if (normalizedGoal.includes("web developer")) {

    recommendations = [

        "HTML",

        "CSS",

        "JavaScript",

        "React",

        "Responsive Web Design"

    ];

}

else if (normalizedGoal.includes("data scientist")) {

    recommendations = [

        "Python",

        "SQL",

        "Statistics",

        "Data Analysis",

        "Machine Learning"

    ];

}

else {

    recommendations = [

        "Programming Fundamentals",

        "Problem Solving",

        "Communication",

        "Teamwork",

        "Practical Projects"

    ];

}

}
  </script>
<div id="ai-result" style="display:none;">

    <h2>Your Career Analysis</h2>

    <p id="career-suggestion"></p>

    <h3>Recommended Skills</h3>

    <ul id="skill-suggestions"></ul>

</div>
</body>

</html>
